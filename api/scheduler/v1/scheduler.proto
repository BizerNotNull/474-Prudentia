syntax = "proto3";

package prudentia.scheduler.v1;

option go_package = "github.com/BizerNotNull/474-Prudentia/api/scheduler/v1;schedulerv1";

service SchedulerService {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
  rpc PrepareDispatch(PrepareDispatchRequest) returns (PrepareDispatchResponse);
  rpc AbandonBeforeDispatch(AbandonBeforeDispatchRequest) returns (Empty);

  rpc GiveUpBeforeDispatch(GiveUpBeforeDispatchRequest) returns (Empty);
  rpc Finalize(FinalizeRequest) returns (Empty);
  rpc MarkAmbiguous(MarkAmbiguousRequest) returns (Empty);
}

// Candidate counts are bounded to four and hmac_sha256 is exactly 32 bytes.
message IdempotencyLookupCandidate {
  uint32 pepper_version = 1;
  bytes hmac_sha256 = 2;
}

// Candidate counts are bounded to four and hmac_sha256 is exactly 32 bytes.
message RequestDigestCandidate {
  uint32 digest_version = 1;
  bytes hmac_sha256 = 2;
}

message FeatureSet {
  // Version 1 defines bits 1 through 4. Unknown versions or bits fail closed.
  uint32 schema_version = 1;
  uint64 bits = 2;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_BACKGROUND = 1;
  PRIORITY_NORMAL = 2;
  PRIORITY_HIGH = 3;
}

enum CachePolicy {
  CACHE_POLICY_UNSPECIFIED = 0;
  CACHE_POLICY_DISABLED = 1;
  CACHE_POLICY_PREFER = 2;
  CACHE_POLICY_REQUIRE_COMPATIBLE = 3;
}

message ScheduleRequest {
  // Request identifiers, tenant_scope, and model are bounded by the v1 codec.
  string request_id = 1;
  string attempt_id = 2;
  bytes tenant_scope = 3;
  repeated IdempotencyLookupCandidate idempotency_lookup_candidates = 4;
  uint32 lookup_write_version = 5;
  repeated RequestDigestCandidate digest_candidates = 6;
  uint32 digest_write_version = 7;
  string model = 8;
  uint32 slot_cost = 9;
  // A positive, codec-bounded total request execution budget.
  int64 execution_budget_ms = 10;
  FeatureSet features = 11;
  Priority priority = 12;
  // Version 1 defines the complete ScheduleRequest field semantics.
  uint32 schema_version = 13;
  // Version 1 defines execution_budget_ms as a total wall-clock budget.
  uint32 budget_schema_version = 14;
  CachePolicy cache_policy = 15;
}

message ReservationRef {
  string reservation_id = 1;
  uint64 generation = 2;
  // Bounded opaque capability plaintext, carried only over authenticated transport.
  bytes capability = 3;
  uint32 schema_version = 4;
}

message Reservation {
  ReservationRef ref = 1;
  uint32 schema_version = 2;
}

message ScheduleResponse {
  Reservation reservation = 1;
  uint32 schema_version = 2;
}

message PrepareDispatchRequest {
  ReservationRef ref = 1;
  uint32 schema_version = 2;
}

message WorkloadIdentity {
  string cluster = 1;
  string namespace = 2;
  string logical_engine = 3;
  string pod_uid = 4;
  uint64 endpoint_epoch = 5;
  uint64 recovery_epoch = 6;
  uint32 schema_version = 7;
}

message DispatchTarget {
  // Bounded internal proxy endpoint; it is not a provider request body.
  string endpoint = 1;
  WorkloadIdentity identity = 2;
  uint32 schema_version = 3;
}

message PrepareDispatchResponse {
  DispatchTarget target = 1;
  uint32 schema_version = 2;
}

enum RerankReason {
  RERANK_REASON_UNSPECIFIED = 0;
  RERANK_REASON_STALE_TARGET = 1;
}

message AbandonBeforeDispatchRequest {
  ReservationRef ref = 1;
  RerankReason reason = 2;
  uint32 schema_version = 3;
}

enum GiveUpReason {
  GIVE_UP_REASON_UNSPECIFIED = 0;
  GIVE_UP_REASON_CANCELED = 1;
  GIVE_UP_REASON_BUDGET_EXPIRED = 2;
  GIVE_UP_REASON_RERANKS_EXHAUSTED = 3;
}

message GiveUpBeforeDispatchRequest {
  ReservationRef ref = 1;
  GiveUpReason reason = 2;
  uint32 schema_version = 3;
}

enum TerminalProof {
  TERMINAL_PROOF_UNSPECIFIED = 0;
  TERMINAL_PROOF_PROVIDER_FINISH = 1;
  TERMINAL_PROOF_NOT_SENT = 2;
  TERMINAL_PROOF_COMPLETE_NON_STREAMING = 3;
  TERMINAL_PROOF_AUTHENTICATED_PROVIDER_TERMINATION = 4;
}

message FinalizeRequest {
  ReservationRef ref = 1;
  TerminalProof proof = 2;
  // Version 1 defines the terminal-proof evidence matrix above.
  uint32 terminal_evidence_version = 3;
  uint32 schema_version = 4;
}

enum AmbiguousCause {
  AMBIGUOUS_CAUSE_UNSPECIFIED = 0;
  AMBIGUOUS_CAUSE_TRANSPORT = 1;
  AMBIGUOUS_CAUSE_CANCELED = 2;
  AMBIGUOUS_CAUSE_PROTOCOL = 3;
}

message MarkAmbiguousRequest {
  ReservationRef ref = 1;
  AmbiguousCause cause = 2;
  // Version 1 defines the bounded ambiguity evidence classes above.
  uint32 evidence_schema_version = 3;
  uint32 schema_version = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 2;
  ERROR_CODE_REQUEST_IN_PROGRESS = 3;
  ERROR_CODE_REQUEST_NOT_REPLAYABLE = 4;
  ERROR_CODE_NO_CAPACITY = 5;
  ERROR_CODE_INVALID_REFERENCE = 6;
  ERROR_CODE_STALE_TARGET = 7;
  ERROR_CODE_INVALID_STATE = 8;
  ERROR_CODE_CANCELED = 9;
  ERROR_CODE_DEADLINE_EXCEEDED = 10;
  ERROR_CODE_UNAVAILABLE = 11;
  ERROR_CODE_INTERNAL = 12;
}

// Attached as a typed gRPC status detail. It deliberately contains no
// diagnostics, endpoints, identities, provider data, or secret material.
message ErrorDetail {
  uint32 schema_version = 1;
  ErrorCode code = 2;
  // Zero means no retry hint; nonzero values are bounded by the v1 codec.
  uint32 retry_after_ms = 3;
}

message Empty {}
