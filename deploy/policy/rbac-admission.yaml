apiVersion: coordination.k8s.io/v1
kind: Lease
metadata: {name: prudentia-controller, namespace: prudentia-system}
spec: {holderIdentity: "", leaseDurationSeconds: 30}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prudentia-controller, namespace: prudentia-system}
rules:
- apiGroups: [""]
  resources: [pods, services]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [delete]
- apiGroups: [policy]
  resources: [pods/eviction]
  verbs: [create]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, statefulsets]
  verbs: [get, list, watch, patch, update]
- apiGroups: [prudentia.io]
  resources: [inferencefleets]
  verbs: [get, list, watch, patch, update]
- apiGroups: [prudentia.io]
  resources: [inferencefleets/status]
  verbs: [get, patch, update]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  resourceNames: [prudentia-controller]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prudentia-controller, namespace: prudentia-system}
subjects: [{kind: ServiceAccount, name: controller, namespace: prudentia-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prudentia-controller}
---
# This policy reserves operation annotations and binds mutations to the dedicated
# controller identity. Namespace isolation is the authorization boundary because
# Kubernetes cannot label-scope list/watch or resourceName-scope create/delete.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: prudentia-operation-ownership}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [apps]
      apiVersions: [v1]
      operations: [UPDATE]
      resources: [deployments, statefulsets]
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [UPDATE, DELETE]
      resources: [pods]
  validations:
  - expression: >-
      request.userInfo.username == 'system:serviceaccount:prudentia-system:controller'
    message: only the namespace controller may mutate managed workloads or Pods
  - expression: >-
      oldObject.metadata.labels['prudentia.io/managed-owner'] == 'controller' &&
      (request.operation == 'DELETE' || object.metadata.labels['prudentia.io/managed-owner'] == 'controller')
    message: target must have controller ownership
  - expression: >-
      request.operation == 'DELETE' ||
      (has(object.metadata.annotations['prudentia.io/operation-token']) &&
       has(object.metadata.annotations['prudentia.io/operation-generation']) &&
       has(object.metadata.annotations['prudentia.io/admission-closed']))
    message: workload mutation requires current operation token, generation, and closed admission
  - expression: >-
      request.operation != 'DELETE' ||
      (has(request.options.preconditions) && has(request.options.preconditions.uid) && has(request.options.preconditions.resourceVersion))
    message: Pod deletion requires exact UID and resourceVersion preconditions
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: prudentia-operation-ownership}
spec:
  policyName: prudentia-operation-ownership
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels: {prudentia.io/dedicated: "true"}
