apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencefleets.prudentia.io
  annotations:
    prudentia.io/status-contract: status exposes bounded states and proof digests only; never prompts, tokens, addresses, tickets, capabilities, credentials, or provider bodies
spec:
  group: prudentia.io
  scope: Namespaced
  names: {plural: inferencefleets, singular: inferencefleet, kind: InferenceFleet, shortNames: [pif]}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [workloadRef, model, capabilityManifestRef]
            properties:
              workloadRef:
                type: object
                required: [apiVersion, kind, name]
                properties:
                  apiVersion: {type: string, enum: [apps/v1]}
                  kind: {type: string, enum: [Deployment, StatefulSet]}
                  name: {type: string, minLength: 1, maxLength: 253}
              model: {type: string, minLength: 1, maxLength: 256}
              capabilityManifestRef: {type: string, minLength: 1, maxLength: 253}
              drain:
                type: object
                properties:
                  state: {type: string, enum: [open, normal, hard, fenced]}
                  deadlineSeconds: {type: integer, minimum: 1, maximum: 3600}
          status:
            type: object
            properties:
              observedGeneration: {type: integer, format: int64}
              writerGeneration: {type: integer, format: int64, minimum: 1}
              recoveryEpoch: {type: integer, format: int64, minimum: 1}
              operationGeneration: {type: integer, format: int64, minimum: 1}
              operationPhase: {type: string, enum: [none, draining, barrier-installing, barrier-observed, mutating, victim-observed, completed, fenced]}
              admissionClosed: {type: boolean}
              proofDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
              conditions:
                type: array
                maxItems: 16
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [type]
                items:
                  type: object
                  required: [type, status, reason, lastTransitionTime]
                  properties:
                    type: {type: string, maxLength: 64}
                    status: {type: string, enum: ["True", "False", Unknown]}
                    reason: {type: string, maxLength: 64}
                    message: {type: string, maxLength: 256}
                    lastTransitionTime: {type: string, format: date-time}
