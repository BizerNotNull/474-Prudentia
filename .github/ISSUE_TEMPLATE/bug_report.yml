name: Bug report
description: Report a reproducible problem in Prudentia
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Prudentia. Please remove secrets from logs and configuration.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Prudentia version or commit, OS, Go version, inference backend, and deployment mode.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or configuration
      description: Redact credentials, tokens, model data, and other sensitive information.
      render: shell
  - type: dropdown
    id: regression
    attributes:
      label: Regression
      description: Did this work in an earlier version?
      options:
        - Unknown
        - "Yes"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed sensitive information from this report.
          required: true
